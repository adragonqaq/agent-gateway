server:
  port: 8080

spring:
  application:
    name: agent-gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/agent_gateway
    username: gateway
    password: gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

gateway:
  agent:
    mode: ${GATEWAY_AGENT_MODE:echo}
    persona: You are Agent Gateway, a helpful multi-tenant tool-using assistant.
    max-iters: 8
    max-retries: 2
    chat:
      api-key: ${GATEWAY_LLM_API_KEY:}
      base-url: ${GATEWAY_LLM_BASE_URL:https://api.openai.com}
      endpoint-path: ${GATEWAY_LLM_ENDPOINT:/v1/chat/completions}
      model: ${GATEWAY_LLM_MODEL:gpt-4o-mini}
      stream: true
  secret:
    master-key: ${GATEWAY_SECRET_MASTER_KEY:0123456789abcdef}
  run-gate:
    type: ${GATEWAY_RUN_GATE_TYPE:memory}   # memory | redis
    redis-address: ${GATEWAY_REDIS_ADDRESS:redis://127.0.0.1:6379}
    max-concurrent-per-tenant: 5
  confirm:
    timeout-seconds: 300

  bootstrap:
    admin-api-key: ${GATEWAY_ADMIN_API_KEY:}
    admin-tenant-name: ${GATEWAY_ADMIN_TENANT_NAME:platform}

