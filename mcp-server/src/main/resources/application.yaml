# =============================================================================
# 演示 MCP Server 配置（独立进程，不进 gateway bootstrap）
# 默认仅本机回环；Docker 中通过 SERVER_ADDRESS=0.0.0.0 对外暴露
# =============================================================================

server:
  # 监听地址：本地开发用 127.0.0.1；compose 容器内设 0.0.0.0
  address: ${SERVER_ADDRESS:127.0.0.1}
  # HTTP 端口；与 docker-compose / README 中 19099 对齐
  port: 19099

spring:
  application:
    # 应用名（日志识别）
    name: agent-gateway-mcp-server

mcp:
  auth:
    # Bearer Token；空=关闭鉴权。非空时 gateway 登记需带 headers.Authorization
    token: ${MCP_AUTH_TOKEN:}

logging:
  level:
    # 演示工具与传输层日志
    com.agent.gateway.mcp: INFO
